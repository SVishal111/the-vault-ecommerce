{% extends "base.html" %}
{% block content %}

<h2>Product Form</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="mb-3">
        {{ form.as_p }}
    </div>

    <button type="submit" class="btn btn-success">
        Save Product
    </button>
</form>

{% endblock %}
