{% extends 'base.html' %}

{% block content %}

<h2>Browse Products</h2>

<div class="row mb-3">
    <div class="col-md-3">
        <h5>Categories</h5>
        <ul class="list-group">
            <a href="/" class="list-group-item">All</a>
            {% for category in categories %}
                <a href="?category={{ category.id }}" class="list-group-item">
                    {{ category.name }}
                </a>
            {% endfor %}
        </ul>
    </div>

    <div class="col-md-9">
        <div class="row">
            {% for product in products %}
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="{{ product.image.url }}" class="card-img-top" height="250">
                        <div class="card-body">
                            <h5>{{ product.name }}</h5>
                            <p>₹ {{ product.price }}</p>
                            <a href="{% url 'product_detail' product.id %}" class="btn btn-dark">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>No products found.</p>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
